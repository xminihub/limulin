name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Test & build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          VERSION=$(npm version "$BUMP" -m "v%s" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @opentui/core's platform packages are libc-filtered (musl variants
      # carry "libc": ["musl"]). A wildcard os/cpu sweep alone still skips
      # them on glibc hosts, so bun build --compile cannot resolve the
      # *-musl specifiers baked into OpenTUI's loader. Lockfile-invisible;
      # runs after the frozen install and tests so it never affects them.
      - name: Install all @opentui/core platform packages (os/cpu/libc wildcards)
        run: |
          CORE_RANGE="$(bun -p "await Bun.file('package.json').json().then(p=>p.dependencies['@opentui/core'])")"
          bun install --os="*" --cpu="*" --libc="*" "@opentui/core@$CORE_RANGE"

      - name: Run tests
        run: bun test

      - name: Build standalone binaries (all targets)
        run: bash scripts/build-binaries.sh

      - name: Verify every target binary was produced
        # Guard against a silent compile failure (e.g. a truncated bun
        # runtime download): fail before pushing the tag if any artifact
        # is missing or empty. Names come from the target table (ADR-0004).
        run: |
          V="${{ steps.version.outputs.version }}"
          bun -e '
            const { TARGETS, binaryAssetName } = await import("./scripts/targets.ts");
            for (const t of TARGETS) {
              const f = `dist/binaries/${binaryAssetName(process.env.V, t.name)}`;
              const size = await Bun.file(f).size;
              if (!size) { console.error(`missing or empty: ${f}`); process.exit(1); }
            }
          '
        env:
          V: ${{ steps.version.outputs.version }}

      - name: Stage darwin binaries for signing job
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries-unsigned
          path: dist/binaries/lim-*-darwin-*

      - name: Stage linux/win32 binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-win32-binaries
          path: |
            dist/binaries/lim-*-linux-x64
            dist/binaries/lim-*-linux-arm64
            dist/binaries/lim-*-win32-x64.exe

      - name: Push commit and tag
        run: git push origin HEAD:refs/heads/main --atomic "refs/tags/v${{ steps.version.outputs.version }}"

    outputs:
      version: ${{ steps.version.outputs.version }}

  sign-macos:
    name: Sign & notarize macOS binaries
    needs: build
    runs-on: macos-latest
    env:
      KEYCHAIN: ci.keychain
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: darwin-binaries-unsigned

      - name: Import Developer ID certificate
        timeout-minutes: 5
        run: |
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign darwin binaries
        timeout-minutes: 10
        run: |
          security unlock-keychain -p ci "$KEYCHAIN"
          for bin in lim-*-darwin-*; do
            codesign --force --timestamp --keychain "$KEYCHAIN" \
              --sign "Developer ID Application" --options runtime "$bin"
            codesign --verify --verbose=2 "$bin"
          done

      - name: Notarize darwin binaries
        timeout-minutes: 30
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/.private && echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.private/AuthKey.p8
          chmod 600 ~/.private/AuthKey.p8
          for bin in lim-*-darwin-*; do
            ditto -c -k --keepParent "$bin" "$bin.zip"
            xcrun notarytool submit "$bin.zip" \
              --key ~/.private/AuthKey.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            rm "$bin.zip"
          done

      - name: Upload signed darwin binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries-signed
          path: lim-*-darwin-*

  publish:
    name: Publish to npm and GitHub Release
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance via GitHub OIDC (spec #4)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The bump commit and tag were pushed by the build job mid-run;
      # check out the tag so generated manifests carry the released
      # version, not the pre-bump one.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.build.outputs.version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{darwin-binaries-signed,linux-win32-binaries}"
          merge-multiple: false

      - name: Assemble tree
        run: |
          mkdir -p dist/binaries
          cp darwin-binaries-signed/lim-*-darwin-* dist/binaries/
          cp linux-win32-binaries/lim-*-linux-x64 linux-win32-binaries/lim-*-linux-arm64 linux-win32-binaries/lim-*-win32-x64.exe dist/binaries/
          rm -rf darwin-binaries-signed linux-win32-binaries

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate npm packages (launcher + 5 platform)
        # Everything publishable to npm is generated here from the single
        # target table; nothing is published from committed manifests.
        run: |
          bun run scripts/npm-packages.ts
          # Only the launcher package ships the README; platform packages
          # carry just their binary plus the manifest.
          cp README.md dist/npm/limulin/README.md

      - name: Publish npm packages with provenance when configured
        # Token auth via NPM_TOKEN, as in the pre-#4 flow. --provenance is
        # deferred: it requires the one-time npm-side trusted-publisher
        # config for all six names (spec #4 Further Notes). Once configured
        # at npmjs.com, add --provenance here and id-token: write is
        # already in place. A rerun of a version already on npm must not
        # force a new version number; anything else is a real failure.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${{ needs.build.outputs.version }}"
          failed=0
          for dir in dist/npm/*; do
            name="$(bun -p "await Bun.file('$dir/package.json').json().then(p=>p.name)")"
            if npm publish "$dir" --access public --ignore-scripts; then
              echo "published $name@$V"
            elif [ "$(npm view "$name@$V" version 2>/dev/null)" = "$V" ]; then
              echo "::warning::$name@$V is already published; skipping"
            else
              echo "::error::$name@$V failed to publish"
              failed=1
            fi
          done
          exit "$failed"

      - name: Package Homebrew tarballs
        # One deterministic tarball asset per Homebrew target: the tap
        # generates a URL block for exactly these four names (ADR-0003).
        # The target list derives from the table, never from literals here.
        run: |
          V="${{ needs.build.outputs.version }}"
          TARGETS="$(bun -e 'const {BREW_TARGETS}=await import("./scripts/homebrew.ts"); console.log(BREW_TARGETS.join(" "))')"
          for target in $TARGETS; do
            bun run scripts/homebrew.ts package \
              --binary "dist/binaries/lim-$V-$target" \
              --version "$V" \
              --target "$target" \
              --dir dist/binaries
          done
          for target in $TARGETS; do
            tarball="dist/binaries/lim-$V-$target.tar.gz"
            [ -s "$tarball" ] || { echo "missing or empty: $tarball"; exit 1; }
          done

      - name: Write SHA256SUMS and lim-latest.txt
        # SHA256SUMS covers every binary and brew tarball asset; the
        # installer verifies against it (spec #4).
        run: |
          V="${{ needs.build.outputs.version }}"
          bun -e '
            const { TARGETS, binaryAssetName, formatSha256Sums, versionFileContent } =
              await import("./scripts/targets.ts");
            const { assetName } = await import("./scripts/homebrew.ts");
            const version = process.env.V;
            const entries = [];
            for (const t of TARGETS) {
              const file = binaryAssetName(version, t.name);
              const sha256 = new Bun.CryptoHasher("sha256")
                .update(await Bun.file(`dist/binaries/${file}`).arrayBuffer()).digest("hex");
              entries.push({ file, sha256 });
            }
            for (const t of TARGETS) {
              if (t.os === "win32") continue;
              const file = assetName(version, t.name);
              const sha256 = new Bun.CryptoHasher("sha256")
                .update(await Bun.file(`dist/binaries/${file}`).arrayBuffer()).digest("hex");
              entries.push({ file, sha256 });
            }
            await Bun.write("dist/binaries/SHA256SUMS", formatSha256Sums(entries));
            await Bun.write("dist/binaries/lim-latest.txt", versionFileContent(version));
          '
        env:
          V: ${{ needs.build.outputs.version }}

      - name: Publish GitHub Release assets
        # Everything under dist/binaries plus the installer: the asset set
        # is exactly what the table and the brew step produced.
        run: |
          V="${{ needs.build.outputs.version }}"
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --generate-notes
          gh release upload "v$V" --clobber dist/binaries/* install.sh
          gh release view "v$V" --json assets --jq '.assets[].name'

  tap:
    name: Bump org Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_TRIGGER_TOKEN }}
      TAP_REPO: xminihub/homebrew-tap
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The tap owns the formula: this dispatches its bump workflow and waits
      # for the run to land, so a release that failed to bump fails here rather
      # than leaving a stale Formula/lim.rb behind (ADR-0003). The tap's
      # tools/lim.json must already carry the linux-arm64 key (ADR-0004
      # cutover: tap PR lands before the first renamed release).
      - name: Dispatch the formula bump
        id: dispatch
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run bump.yml --repo "$TAP_REPO" --ref main \
            -f name=lim -f version="$VERSION"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$TAP_REPO" --workflow bump.yml \
              --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started_at\")] | .[0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::bump.yml never started for lim $VERSION"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "bump run: https://github.com/$TAP_REPO/actions/runs/$run_id"

      - name: Wait for the bump to land
        run: |
          if ! gh run watch "${{ steps.dispatch.outputs.run_id }}" \
              --repo "$TAP_REPO" --exit-status --interval 20; then
            echo "::error::Formula/lim.rb was not bumped for $VERSION"
            exit 1
          fi
          gh run view "${{ steps.dispatch.outputs.run_id }}" --repo "$TAP_REPO" \
            --json conclusion --jq '"tap bump conclusion: \(.conclusion)"'
