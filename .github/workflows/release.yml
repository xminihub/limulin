name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Test & build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          VERSION=$(npm version "$BUMP" -m "v%s" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @opentui/core's platform packages are libc-filtered (musl variants
      # carry "libc": ["musl"]). A wildcard os/cpu sweep alone still skips
      # them on glibc hosts, so bun build --compile cannot resolve the
      # *-musl specifiers baked into OpenTUI's loader. Lockfile-invisible;
      # runs after the frozen install and tests so it never affects them.
      - name: Install all @opentui/core platform packages (os/cpu/libc wildcards)
        run: |
          CORE_RANGE="$(bun -p "await Bun.file('package.json').json().then(p=>p.dependencies['@opentui/core'])")"
          bun install --os="*" --cpu="*" --libc="*" "@opentui/core@$CORE_RANGE"

      - name: Run tests
        run: bun test

      - name: Build dist bundle
        run: bun run build

      - name: Dist artifact tests (node + bun)
        run: bun test tests/dist.test.ts

      - name: Build standalone binaries (all targets)
        run: bash scripts/build-binaries.sh

      - name: Verify every target binary was produced
        # Guard against a silent compile failure (e.g. a truncated bun
        # runtime download): fail before pushing the tag if any artifact
        # is missing or empty.
        run: |
          V="${{ steps.version.outputs.version }}"
          for f in \
            "dist/binaries/lim-$V-darwin-arm64" \
            "dist/binaries/lim-$V-darwin-x64" \
            "dist/binaries/lim-$V-linux-x64" \
            "dist/binaries/lim-$V-linux-aarch64" \
            "dist/binaries/lim-$V-windows-x64.exe"; do
            [ -s "$f" ] || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Stage artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            package.json
            bun.lock
            dist/lim.js

      - name: Stage darwin binaries for signing job
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries-unsigned
          path: |
            dist/binaries/lim-*-darwin-arm64
            dist/binaries/lim-*-darwin-x64

      - name: Stage linux/windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-binaries
          path: |
            dist/binaries/lim-*-linux-x64
            dist/binaries/lim-*-linux-aarch64
            dist/binaries/lim-*-windows-x64.exe

      - name: Push commit and tag
        run: git push origin HEAD:refs/heads/main --atomic "refs/tags/v${{ steps.version.outputs.version }}"

    outputs:
      version: ${{ steps.version.outputs.version }}

  sign-macos:
    name: Sign & notarize macOS binaries
    needs: build
    runs-on: macos-latest
    env:
      KEYCHAIN: ci.keychain
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: darwin-binaries-unsigned

      - name: Import Developer ID certificate
        timeout-minutes: 5
        run: |
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign darwin binaries
        timeout-minutes: 10
        run: |
          security unlock-keychain -p ci "$KEYCHAIN"
          for bin in lim-*-darwin-*; do
            codesign --force --timestamp --keychain "$KEYCHAIN" \
              --sign "Developer ID Application" --options runtime "$bin"
            codesign --verify --verbose=2 "$bin"
          done

      - name: Notarize and staple
        timeout-minutes: 30
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/.private && echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.private/AuthKey.p8
          chmod 600 ~/.private/AuthKey.p8
          for bin in lim-*-darwin-*; do
            ditto -c -k --keepParent "$bin" "$bin.zip"
            xcrun notarytool submit "$bin.zip" \
              --key ~/.private/AuthKey.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$bin"
            rm "$bin.zip"
          done

      - name: Upload signed darwin binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries-signed
          path: lim-*-darwin-*

  publish:
    name: Publish to npm and GitHub Release
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{npm-package,darwin-binaries-signed,linux-windows-binaries}"
          merge-multiple: false

      - name: Assemble tree
        run: |
          mkdir -p dist/binaries
          cp npm-package/package.json npm-package/bun.lock .
          cp npm-package/dist/lim.js dist/lim.js
          cp darwin-binaries-signed/lim-*-darwin-* dist/binaries/
          cp linux-windows-binaries/lim-*-linux-x64 linux-windows-binaries/lim-*-linux-aarch64 linux-windows-binaries/lim-*-windows-x64.exe dist/binaries/
          rm -rf npm-package darwin-binaries-signed linux-windows-binaries

      - name: Install dependencies (for publish hook checks)
        run: bun install --frozen-lockfile

      - name: Publish to npm
        # --ignore-scripts: the tested dist/lim.js is published as-is;
        # prepublishOnly (check+build) already ran in the build job.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with all binaries
        run: |
          V="${{ needs.build.outputs.version }}"
          gh release create "v$V" --generate-notes \
            "dist/binaries/lim-$V-darwin-arm64" \
            "dist/binaries/lim-$V-darwin-x64" \
            "dist/binaries/lim-$V-linux-x64" \
            "dist/binaries/lim-$V-linux-aarch64" \
            "dist/binaries/lim-$V-windows-x64.exe"
