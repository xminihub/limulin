name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        env:
          BUMP: ${{ github.event.inputs.bump }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const deadline = Date.now() + 13 * 60 * 1000;

            // Only gate on this repo's own workflows (CI, and Release's own
            // bump commit produced by a previous run of this workflow).
            const relevant = new Set(["CI", "Release"]);

            async function scan() {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              const done = [];
              let pending = false;
              for (const run of runs) {
                if (!relevant.has(run.name)) continue;
                if (run.status !== "completed") { pending = true; continue; }
                done.push(`${run.name} (${run.display_title}) -> ${run.conclusion}`);
                if (run.conclusion !== "success") {
                  core.setFailed(`CI not green on ${sha}: ${run.name} concluded ${run.conclusion}`);
                  return true;
                }
              }
              if (!pending && done.length === 0) {
                core.setFailed(`No CI workflow runs found on ${sha} — has ci.yml run?`);
                return true;
              }
              if (!pending) {
                core.info(`All relevant checks green:\n${done.join("\n")}`);
                return true;
              }
              return false;
            }

            while (Date.now() < deadline) {
              if (await scan()) return;
              await new Promise((r) => setTimeout(r, 15 * 1000));
            }
            core.setFailed(`Timed out waiting for CI to finish on ${sha}`);

  release:
    name: Publish to npm
    needs: ci-gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          VERSION=$(npm version "$BUMP" -m "v%s" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit and tag
        run: git push origin HEAD:refs/heads/main --atomic "refs/tags/v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
