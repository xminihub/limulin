name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Check (source + artifact seams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun fmt --check
      # Source, launcher (node black box), installer (bash against a local
      # release fixture), target table and npm package generation.
      - run: bun test
      - name: Verify npm package generation end to end
        # Runs the publish-time generator in CLI mode against stub binaries,
        # then checks each package tarball holds exactly its manifest plus
        # the binary (and the launcher plus README for limulin). LC_ALL=C
        # pins the byte-wise sort both sides of every diff share.
        env:
          LC_ALL: C
        run: |
          V="$(bun -p "await Bun.file('package.json').json().then(p=>p.version)")"
          bun -e '
            const { TARGETS, binaryAssetName } = await import("./scripts/targets.ts");
            const version = await Bun.file("package.json").json().then((p) => p.version);
            for (const t of TARGETS) {
              const f = `dist/binaries/${binaryAssetName(version, t.name)}`;
              await Bun.write(f, `stub ${t.name}`);
              await Bun.spawn(["chmod", "+x", f]);
            }
          '
          bun run scripts/npm-packages.ts
          cp README.md dist/npm/limulin/README.md
          cd dist/npm
          for p in */; do
            (cd "$p" && npm pack --silent > /dev/null)
          done
          test -f limulin/limulin-$V.tgz
          tar -tzf limulin-win32-x64/limulin-win32-x64-$V.tgz | sort > /tmp/win.txt
          diff <(printf '%s\n' package/lim.exe package/package.json | sort) /tmp/win.txt
          tar -tzf limulin/limulin-$V.tgz | sort > /tmp/main.txt
          diff <(printf '%s\n' package/bin/lim.cjs package/package.json package/README.md | sort) /tmp/main.txt
